[project]
name = "habit-hooks-csharp"
version = "0.1.0"
description = "The C# Habit Hooks plugin"
requires-python = ">=3.11"
dependencies = []

[project.entry-points."habit_hooks.plugins"]
csharp = "habit_hooks_csharp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/habit_hooks_csharp"]
