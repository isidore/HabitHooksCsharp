name: Publish to PyPI

# Runs when a GitHub release is published. Set the version in pyproject.toml first;
# the release tag should match it (e.g. v0.2.0).
#
# Uses PyPI trusted publishing, so no token is stored here. One-time setup on pypi.org:
# add a trusted publisher for this repo with workflow `publish.yml` and environment `pypi`.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: astral-sh/setup-uv@v6
      - name: Test csharp-tool
        run: dotnet test HabitHooksCsharp.slnx
      - name: Check the tag matches the version
        run: |
          version=$(uv version --short)
          [ "${GITHUB_REF_NAME#v}" = "$version" ] || { echo "tag $GITHUB_REF_NAME doesn't match version $version"; exit 1; }
      - name: Build the wheel and sdist
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
