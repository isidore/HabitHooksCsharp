name: Publish to PyPI

# Runs when a GitHub release is published. The release tag sets the version (v0.2.0 publishes 0.2.0);
# pyproject.toml on main stays at 0.0.0, so local builds are never mistaken for a release.
#
# Uses PyPI trusted publishing, so no token is stored here. One-time setup on pypi.org:
# add a trusted publisher for this repo with workflow `publish.yml` and environment `pypi`.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: astral-sh/setup-uv@v6
      - name: Test csharp-tool
        run: dotnet test HabitHooksCsharp.slnx
      - name: Set the version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-]?[0-9A-Za-z.]+)?$ ]] || { echo "tag $GITHUB_REF_NAME isn't a version like v1.2.3"; exit 1; }
          sed -i "s/^version = \".*\"$/version = \"$version\"/" pyproject.toml
          grep '^version = ' pyproject.toml
      - name: Build the wheel and sdist
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
