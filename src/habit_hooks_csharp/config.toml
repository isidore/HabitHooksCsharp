language = "csharp"
files = ["**/*.cs"]
sensors = ["roslyn", "comment", "smells"]
transformers = []

# The comment sensor runs a .NET tool and the roslyn sensor runs `dotnet build`;
# the roslyn sensor also shapes the build warnings with jq.
detectors = [
  { name = "dotnet", kind = "command", install = "Install the .NET SDK: https://dotnet.microsoft.com/download" },
  { name = "jq", kind = "command", install = "brew install jq" },
]

[runners]
cs = "dotnet"
