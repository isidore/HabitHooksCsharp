# Builds the project in Debug with the smell analyzers turned on (csharp-tool/analyzers/), whatever
# the project's own settings, and reports their warnings for the files in scope.
# If the folder has more than one solution or project, name one in the project's config:
#   [sensors.roslyn]
#   args = ["--project", "MySolution.sln"]
argv = ["${detector:dotnet}", "${dir}/../csharp-tool/bin/Release/net8.0/csharp-tool.dll", "analyzers", "${args}", "--", "${files}"]
